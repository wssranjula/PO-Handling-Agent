services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: po_agent
      POSTGRES_USER: po_agent
      POSTGRES_PASSWORD: po_agent
    ports:
      - "5432:5432"
    volumes:
      - po_agent_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U po_agent -d po_agent"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  po_agent_postgres:

